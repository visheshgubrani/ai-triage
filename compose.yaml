name: ai-triage

# `docker compose up --build` runs everything: infrastructure, a one-shot `init` (migrations, bucket,
# demo seed including the eval dataset and runs), then api, worker and web in replay mode, so no API
# key is needed. Contributors run only the infrastructure (`pnpm infra:up`) and `pnpm dev`.
# Secrets below are dev-only defaults; override them in the environment for anything else.
x-app-env: &app-env
  DATABASE_OWNER_URL: postgres://triage:triage@postgres:5432/triage
  DATABASE_URL: postgres://triage_app:triage_app@postgres:5432/triage
  S3_ENDPOINT: http://storage:9000
  S3_PUBLIC_ENDPOINT: http://localhost:${S3_PORT:-9020}
  S3_REGION: us-east-1
  S3_BUCKET: triage
  S3_ACCESS_KEY_ID: triage
  S3_SECRET_ACCESS_KEY: triage-secret
  BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-dev-only-secret-change-me-0123456789abcdef}
  BETTER_AUTH_URL: http://localhost:${API_PORT:-8787}
  WEB_ORIGIN: http://localhost:${WEB_PORT:-3000}
  POSTMARK_INBOUND_USER: postmark
  POSTMARK_INBOUND_PASSWORD: ${POSTMARK_INBOUND_PASSWORD:-dev-only-postmark-password}
  LLM_MODE: ${LLM_MODE:-replay}
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
  WEBHOOK_ALLOW_HTTP: "true"
  DEMO_WEBHOOK_URL: http://webhook-catcher:9030/hooks/demo
  DEMO_WEBHOOK_SECRET: ${DEMO_WEBHOOK_SECRET:-whsec_dev_only_demo_webhook_secret}

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: triage
      POSTGRES_PASSWORD: triage
      POSTGRES_DB: triage
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5440}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U triage -d triage"]
      interval: 2s
      timeout: 3s
      retries: 30

  # S3-compatible object storage (RustFS; MinIO no longer publishes community images).
  # Pinned by digest (v1.0.4) so CI and local runs use the same build.
  storage:
    image: rustfs/rustfs:1.0.4@sha256:ed9210d6411d77ffceb70d94b964a3cb7d225983368bc25bebe01e995293dcc2
    environment:
      RUSTFS_ACCESS_KEY: triage
      RUSTFS_SECRET_KEY: triage-secret
      RUSTFS_CONSOLE_ENABLE: "true"
    ports:
      - "127.0.0.1:${S3_PORT:-9020}:9000"
      - "127.0.0.1:${S3_CONSOLE_PORT:-9021}:9001"
    volumes:
      - storage-data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9000/health >/dev/null"]
      interval: 2s
      timeout: 3s
      retries: 30

  # One-shot: create the bucket (409 = already exists).
  storage-init:
    image: rustfs/rustfs:1.0.4@sha256:ed9210d6411d77ffceb70d94b964a3cb7d225983368bc25bebe01e995293dcc2
    depends_on:
      storage:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        code=$$(curl -s -o /dev/null -w "%{http_code}" -X PUT
        --aws-sigv4 "aws:amz:us-east-1:s3" --user "triage:triage-secret"
        http://storage:9000/triage);
        echo "create bucket: HTTP $$code";
        [ "$$code" = 200 ] || [ "$$code" = 409 ]
    restart: "no"

  # Local webhook receiver: verifies X-Triage-Signature and lists deliveries at http://localhost:9030.
  # The demo tenant's webhook points here (DEMO_WEBHOOK_URL / DEMO_WEBHOOK_SECRET in .env).
  webhook-catcher:
    image: node:24-alpine
    command: ["node", "/app/catcher.mjs"]
    environment:
      PORT: "9030"
      WEBHOOK_SECRET: ${DEMO_WEBHOOK_SECRET:-whsec_dev_only_demo_webhook_secret}
    ports:
      - "127.0.0.1:${CATCHER_PORT:-9030}:9030"
    volumes:
      - ./infra/webhook-catcher:/app:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9030/requests >/dev/null"]
      interval: 2s
      timeout: 3s
      retries: 30

  # One-shot, idempotent: migrations (app role, pg-boss queues) and the demo seed.
  init:
    build:
      context: .
      args:
        NEXT_PUBLIC_API_URL: http://localhost:${API_PORT:-8787}
    image: ai-triage-app
    command: ["sh", "-c", "pnpm db:migrate && pnpm db:seed"]
    environment: *app-env
    depends_on:
      postgres:
        condition: service_healthy
      storage-init:
        condition: service_completed_successfully
    restart: "no"

  api:
    image: ai-triage-app
    pull_policy: never
    command: ["pnpm", "--filter", "@ai-triage/api", "start"]
    environment: *app-env
    ports:
      - "127.0.0.1:${API_PORT:-8787}:8787"
    depends_on:
      init:
        condition: service_completed_successfully
    restart: unless-stopped

  worker:
    image: ai-triage-app
    pull_policy: never
    command: ["pnpm", "--filter", "@ai-triage/worker", "start"]
    environment: *app-env
    depends_on:
      init:
        condition: service_completed_successfully
    restart: unless-stopped

  web:
    image: ai-triage-app
    pull_policy: never
    command: ["pnpm", "--filter", "@ai-triage/web", "start"]
    environment:
      <<: *app-env
      # Server components call the API inside the compose network; the browser uses localhost.
      API_INTERNAL_URL: http://api:8787
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_started
    restart: unless-stopped

volumes:
  postgres-data:
  storage-data:
