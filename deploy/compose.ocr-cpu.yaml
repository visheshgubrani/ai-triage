# Optional OCR for scans and photos (install.sh --ocr cpu; docs/install.md, "OCR"). On the CPU: about 30 s a page on 12 cores, and 1.2 GB of memory.
# PaddleOCR-VL 1.6 served by llama.cpp's server; the worker calls its OpenAI-compatible API.
services:
  # One-shot: the pinned model files (about 1.8 GB the first time), checked by SHA-256.
  ocr-model:
    image: ${TRIAGE_IMAGE:-ghcr.io/visheshgubrani/ai-triage}:${TRIAGE_VERSION:-latest}
    command: ["cli", "ocr-model", "--dir", "/models"]
    volumes:
      - ocr-models:/models
    restart: "no"

  ocr:
    image: ghcr.io/ggml-org/llama.cpp:server@sha256:ba68b6996ba6d27a49a9864452194128e118a1fcb96dd663f223a13e0a2857a8
    command:
      - -m
      - /models/PaddleOCR-VL-1.6-GGUF.gguf
      - --mmproj
      - /models/PaddleOCR-VL-1.6-GGUF-mmproj.gguf
      - --host
      - 0.0.0.0
      - --port
      - "8080"
      - --temp
      - "0"
      - -c
      - "8192"
      - -ngl
      - "99"
    volumes:
      - ocr-models:/models:ro
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 60
    depends_on:
      ocr-model:
        condition: service_completed_successfully
    restart: unless-stopped
    logging:
      driver: json-file
      options: { max-size: 20m, max-file: "5" }

  worker:
    environment:
      OCR_URL: http://ocr:8080/v1
    depends_on:
      ocr:
        condition: service_healthy

volumes:
  ocr-models:
