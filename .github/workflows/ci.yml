name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: the jobs only read the repository.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Never call Claude from CI: replay mode only, and no API key is configured.
      LLM_MODE: replay
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4; pnpm version from package.json "packageManager"
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: cp .env.example .env
      # Postgres and RustFS from compose.yaml, the same as local development.
      - run: docker compose up -d --wait postgres storage && docker compose run --rm storage-init
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      # Unit tests plus DB tests (RLS, constraints, queue atomicity, auth, storage, pipeline in replay).
      - run: pnpm test
      - run: pnpm build

  # Known vulnerabilities in production dependencies. High and critical fail the build; moderate ones
  # (today: esbuild's dev server, via drizzle-kit) are reviewed by hand.
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .nvmrc
          # Nothing is installed here, so there's no pnpm store to cache (setup-node v5 caches by default).
          package-manager-cache: false
      - run: pnpm audit --prod --audit-level high

  # The image (`docker compose up`, deploy/compose.yaml) must keep building, stay slim, start, and
  # install (install.sh) on a fresh runner.
  # Built only, not pushed: releases push (release.yml).
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          load: true
          tags: ghcr.io/${{ github.repository }}:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # The runtime holds bundles and Next's standalone output, not the workspace (was 1.86 GB).
      - name: Size budget (450 MB)
        run: |
          size=$(docker image inspect ghcr.io/${{ github.repository }}:ci -f '{{.Size}}')
          echo "image: $((size / 1000000)) MB"
          test "$size" -lt 450000000
      # Both exit non-zero on purpose: the usage lists the bundled CLIs, and the worker explains a
      # missing environment instead of crashing.
      - name: The entrypoint and the bundles run
        run: |
          out=$(docker run --rm ghcr.io/${{ github.repository }}:ci cli 2>&1 || true)
          grep -q preflight <<<"$out"
          out=$(docker run --rm ghcr.io/${{ github.repository }}:ci worker 2>&1 || true)
          grep -q "DATABASE_URL is not set" <<<"$out"
      - name: Shell scripts (shellcheck)
        run: shellcheck -s sh install.sh deploy/triage scripts/install-smoke.sh
      # The install path end to end with this image: install.sh from this checkout, setup through
      # the API, a document on the simulator to review, then backup and restore into a second
      # installation (scripts/install-smoke.sh). Then the same as a server with HTTPS, on Caddy's
      # own CA for app.localhost.
      - name: Install smoke (local)
        run: |
          docker tag ghcr.io/${{ github.repository }}:ci ai-triage-ci:ci
          sh scripts/install-smoke.sh ai-triage-ci ci
      - name: Install smoke (server, HTTPS)
        run: sh scripts/install-smoke.sh ai-triage-ci ci --host app.localhost --email ci@example.com

  # The walkthroughs in a browser against the demo in containers, built from this commit: review
  # and delivery, evals, Gmail sync (fake Google), and a custom category on the simulator in a
  # workspace of its own (so the demo's recorded answers stay valid for the others).
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          load: true
          tags: ghcr.io/visheshgubrani/ai-triage:ci
          cache-from: type=gha
      - name: Start the demo and wait for its documents
        env:
          TRIAGE_VERSION: ci
        run: |
          docker compose up -d
          for i in $(seq 1 120); do curl -fsS http://localhost:3000/api/ready >/dev/null 2>&1 && break; sleep 3; done
          q="select count(*) filter (where processing_status not in ('done','failed','skipped')) || ' ' || count(*) from documents"
          for i in $(seq 1 120); do
            set -- $(docker compose exec -T postgres psql -U triage -d triage -tAc "$q")
            [ "${1:-1}" = 0 ] && [ "${2:-0}" -ge 60 ] && break
            sleep 5
          done
          echo "documents waiting: ${1:-?}, total: ${2:-?}"
      - name: A workspace on the simulator for the categories spec
        env:
          TRIAGE_VERSION: ci
        run: |
          link=$(docker compose exec -T -e DEFAULT_MODEL=sim:simulated api entrypoint cli tenant-create \
            --name E2E --slug e2e --admin e2e-admin@e2e.test --accept-with google_or_password | grep -Eo 'http[^ ]+/invite#[^ ]+')
          echo "E2E_INVITE_URL=$link" >> "$GITHUB_ENV"
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm e2e
      - if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: e2e-traces
          path: test-results/
          retention-days: 7
      - if: failure()
        env:
          TRIAGE_VERSION: ci
        run: docker compose logs --tail 200 api worker init
