name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: the jobs only read the repository.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Never call Claude from CI: replay mode only, and no API key is configured.
      LLM_MODE: replay
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4; pnpm version from package.json "packageManager"
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: cp .env.example .env
      # Postgres and RustFS from compose.yaml, the same as local development.
      - run: docker compose up -d --wait postgres storage && docker compose run --rm storage-init
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      # Unit tests plus DB tests (RLS, constraints, queue atomicity, auth, storage, pipeline in replay).
      - run: pnpm test
      - run: pnpm build

  # Known vulnerabilities in production dependencies. High and critical fail the build; moderate ones
  # (today: esbuild's dev server, via drizzle-kit) are reviewed by hand.
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .nvmrc
      - run: pnpm audit --prod --audit-level high

  # The quickstart image (`docker compose up --build`) must keep building. Built only, not pushed.
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - run: docker compose build init
