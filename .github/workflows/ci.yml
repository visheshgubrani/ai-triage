name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Never call Claude from CI: replay mode only, and no API key is configured.
      LLM_MODE: replay
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4 # version from package.json "packageManager"
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: cp .env.example .env
      # Postgres and RustFS from compose.yaml, the same as local development.
      - run: docker compose up -d --wait postgres storage && docker compose run --rm storage-init
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      # Unit tests plus DB tests (RLS, constraints, queue atomicity, auth, storage, pipeline in replay).
      - run: pnpm test
      - run: pnpm build

  # The quickstart image (`docker compose up --build`) must keep building. Built only, not pushed.
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - run: docker compose build init
