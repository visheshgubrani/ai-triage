name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      # Same credentials and port as compose.yaml, so .env.example works unchanged.
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: triage
          POSTGRES_PASSWORD: triage
          POSTGRES_DB: triage
        ports:
          - 5440:5432
        options: >-
          --health-cmd "pg_isready -U triage -d triage"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      # Never call Claude from CI: replay mode only, and no API key is configured.
      LLM_MODE: replay
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4 # version from package.json "packageManager"
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: cp .env.example .env
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      # Unit tests plus DB tests (RLS, constraints, queue atomicity, auth) against the service above.
      - run: pnpm test
      - run: pnpm build
